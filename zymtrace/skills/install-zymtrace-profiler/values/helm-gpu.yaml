# GPU profiler agent — Helm values for the zymtrace profiler chart.
#
# NVIDIA: REQUIRES CUDA 12.x OR HIGHER. CUDA 11.x and below are not supported.
# AMD: requires ROCm 7.x or higher on x86_64.
# Architecture: AMD64/x86_64 and ARM64 are both supported (AMD GPUs: x86_64 only).
#
# Use case: profile GPU workloads (training + inference) plus collect GPU metrics
# (utilization, memory, temperature, SM efficiency, Tensor Core, PCIe throughput).
# Also collects inference server metrics: vLLM, SGLang, NVIDIA Dynamo-Triton.
#
# Install:
#   helm upgrade --install profiler zymtrace/profiler \
#     --namespace zymtrace --create-namespace \
#     -f zymtrace-profiler-values.yaml \
#     --reset-then-reuse-values --atomic --debug
#
# After install, profile your workload: see the "Profiling real workloads"
# section of reference.md for training and inference env-var/mount setup.

global:
  ClusterMetadata:
    cluster_id: ""   # e.g. "prod-eks-us-west-2"

profiler:
  # Extract the GPU profiler libraries (CUDA and ROCm) to host path /var/lib/zymtrace/profiler.
  # Workloads mount that path and load the library: CUDA_INJECTION64_PATH (NVIDIA) or
  # ROCP_TOOL_LIBRARIES + ROCPROFILER_REGISTER_LIBRARY (AMD). On NVIDIA, the UI can inject
  # it automatically instead (Settings → Agent Config → Inject CUDA Profiler).
  cudaProfiler:
    enabled: true

  args:
    - "-collection-agent=zymtrace-gateway.zymtrace.svc.cluster.local:80"
    - "-disable-tls"   # remove if pointing at external HTTPS endpoint

    # GPU metrics — on by default in the agent; listed here for visibility.
    - "--enable-gpu-metrics"

    # Auto-detect the NVML library path. Recommended for first install; once you know
    # the path the profiler discovered, switch to --nvml-path=<path> for production.
    - "--nvml-auto-scan"

    # Framework metrics — automatic collection for these inference servers when present.
    # All default to true in the agent; listed here for visibility / explicit disable.
    # - "--enable-vllm-metrics"
    # - "--enable-sglang-metrics"
    # - "--enable-triton-metrics"

    # Optional: tags for filtering. Format: key:value;key:value
    # - "-tags=env:prod;gpu:h100"

  # Schedule only on GPU nodes (recommended — CPU nodes don't need the GPU profiler).
  # For AMD GPU nodes, replace this with a label your AMD nodes carry (check
  # `kubectl get nodes --show-labels`), or remove nodeSelector.
  nodeSelector:
    nvidia.com/gpu: "true"

  # Tolerate the standard NVIDIA GPU taint (chart default already includes this).
  # tolerations:
  #   - key: "nvidia.com/gpu"
  #     operator: "Exists"
  #     effect: "NoSchedule"
